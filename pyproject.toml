[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zikaron"
version = "0.0.0"
description = "Tribal-knowledge memory for coding agents"
requires-python = "==3.12.*"
dependencies = [
    "aiosqlite==0.22.1",
    "sqlite-vec==0.1.9",
    "fastembed==0.8.0",
    # `zikaron-mcp` only. Deliberately not stdlib-only, unlike `zikaron-hook` — see
    # coding-standards.md §6 for the cost-model reasoning (once per agent spawn, not once per
    # message) and architecture.md §Components for the measured import cost.
    "fastmcp==3.4.5",
]

# The two commands a shipped kiro config names, and the reason they are console scripts rather
# than `python -m` command lines: a hook entry's `command` and an `mcpServers` entry's `command`
# each need one absolute path, and a console script's shebang pins the interpreter Zikaron is
# installed into — which is also the interpreter start-if-absent will spawn the service with, via
# `sys.executable`. Measured, so the choice costs nothing: a full hook process through the script
# form is 68.6 ms median against 70.0 ms through `-m` (architecture.md §"The install contract").
#
# `zikaron-service` is deliberately *not* here. No config names it: it is spawned by
# `sys.executable -m zikaron.service.main` from whichever client finds the socket absent, which is
# the path the service and hook clients are already tested against. An entry point nothing invokes
# is one more shipped surface with no
# test behind it.
[project.scripts]
zikaron-hook = "zikaron.hook.main:main"
zikaron-mcp = "zikaron.mcp.main:main"

[project.optional-dependencies]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    # Property-based tests, for the places the design states a property rather than a case:
    # chunking never loses content, and no chunk exceeds the budget it was cut to.
    "hypothesis==6.140.2",
    # Tests only, and never imported by shipped code. Two of Claude Code's four installed
    # artefacts are YAML-frontmatter Markdown, and the installer emits that frontmatter by string
    # formatting — so the only way to assert it is *valid* is to parse it with something that did
    # not write it. Present transitively before this line existed; declared because a test that
    # silently stops running when a transitive dependency moves is worse than no test. The failure
    # it guards is specific and easy to reintroduce: a description that grows a `: ` becomes a
    # different YAML document, and the harness would read a mangled agent rather than refuse one.
    "pyyaml==6.0.3",
    # `mypy --strict` covers the tests as well as the package (see `check.sh`), so the parser above
    # needs stubs or the gate fails on the import rather than on anything about the code.
    "types-PyYAML==6.0.12.20250915",
]

[tool.setuptools.packages.find]
include = ["zikaron*"]

[tool.setuptools.package-data]
zikaron = ["py.typed"]

# ---------------------------------------------------------------------------
# Formatter and linter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["spikes", "experiments"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "ANN",  # every signature annotated
    "S",    # bandit
    "B",    # bugbear
    "A",    # shadowed builtins
    "C4",   # comprehensions
    "PIE",
    "PT",   # pytest style
    "RET",
    "SIM",
    "ARG",  # unused arguments
    "PTH",  # pathlib over os.path
    "ERA",  # commented-out code
    "PL",   # pylint
    "TRY",
    "RUF",
]
ignore = [
    # Zikaron raises exactly one exception type carrying a design error code, so the
    # "define your own exception" and "abstract the raise" advice both fire on every
    # deliberate raise site.
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and compare against literals transcribed from the design tables:
# a named constant per expected number would hide the transcription it exists to check.
"tests/**" = ["S101", "PLR2004"]
# `install/assets.py` is shipped prose, not code: a model-facing system prompt and a skill file
# whose YAML frontmatter must stay on one physical line. Its wrapping is chosen for the artifact
# that gets installed, and reflowing a paragraph to satisfy a source-code column limit changes what
# a model reads in order to satisfy a rule about reading code. The file contains no logic for a
# long line to hide inside — two string constants and a docstring.
"zikaron/install/assets.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
]

# `sqlite-vec` ships no type stubs and no `py.typed` marker. Its Python surface used here is one
# function, `loadable_path() -> str`, so an ignore here costs no real type safety and a
# hand-written stub package would be pure overhead for one call site.
[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `manual` needs a live model API and so is never in the default run; ask for it by
# marker when you mean to spend money.
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not manual and not integration_kiro and not integration_claude",
]
markers = [
    "integration: real fastembed, real sqlite-vec, real socket, real subprocess",
    "manual: needs a live model API; excluded from the default run",
    # **Excluded from the default run, so the gate is hermetic.** These need a third-party binary
    # installed *and working* on the machine — not merely importable — which makes them a different
    # kind of dependency from `integration`, whose "real" things are all Zikaron's own processes.
    #
    # The distinction was earned rather than anticipated: an expired `kiro-cli` credential turned
    # `./check.sh` red for a reason that had nothing to do with the code, and the same tests would
    # go *green* on a machine whose harness behaved differently. A gate that can mislead in both
    # directions is not a gate. Run them deliberately:
    #     .venv/bin/pytest -m integration_kiro
    #     .venv/bin/pytest -m integration_claude
    #
    # Underscores because a marker is an attribute on `pytest.mark`, so `integration-kiro` is not
    # expressible.
    "integration_kiro: needs a real, working `kiro-cli` on PATH; excluded from the default run",
    "integration_claude: needs a real Claude Code binary on PATH; excluded from the default run",
]
# `zikaron-core`'s own SQL runs exclusively through `aiosqlite` (coding-standards.md §6), so
# every test that exercises the store is itself a coroutine. `auto` runs every `async def test_*`
# without a per-test `@pytest.mark.asyncio`, which would otherwise be required on every one of
# them with no exceptions worth carving out.
asyncio_mode = "auto"
# Stated rather than defaulted, because the default is on its way to changing: pytest-asyncio warns
# that an unset value currently caches async fixtures at `fixture` scope and will later default to
# `function`. Leaving it unset means an ordinary dependency bump silently re-scopes every async
# fixture in the suite, and the symptom would be flaky store tests rather than a configuration
# error — the same shape as a pinned floor that quietly stops holding. `function` is both the
# value the library is moving toward and the stricter one: fixtures here hand out real SQLite
# stores, and a store shared further than the test that asked for it is exactly the cross-test
# coupling this suite must not have.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
# A ratchet: it may rise, never fall.
fail_under = 90
