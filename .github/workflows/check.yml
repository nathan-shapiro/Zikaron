# The continuous instrument. `design/distribution.md` §"What CI asserts" is normative.
#
# **This is not a third gate.** `check.sh` is the per-edit gate; `check-matrix.sh` is what a
# milestone needs locally. This workflow asserts *the matrix's own claim* — every supported version
# green on one tree — against a commit rather than a working tree, by running `check.sh` once per
# version rather than by running `check-matrix.sh` at all.
#
# **It is strictly stronger than the matrix on one axis and strictly weaker on another.** Stronger:
# the matrix has to build a fingerprint over `HEAD` plus every staged, unstaged and untracked
# difference and sample it twice, because a local tree moves while a run is in flight — it caught its
# own author editing `CLAUDE.md` mid-run. A job checks out one commit, so *every version saw the same
# tree* is guaranteed by the SHA. Weaker: no live harness, so `integration_kiro` and
# `integration_claude` stay local-only and nothing here exercises a real session pushing or
# searching.
#
# **`FASTEMBED_CACHE_PATH` is set in a `run:` step rather than in an `env:` block, and the reason is
# a context-availability rule.** The `runner` context is available only at *step* level — not in
# workflow-level `env:` and not in `jobs.<id>.env:`. `${{ runner.temp }}` at either of those levels
# is a reference to a context outside its availability, which GitHub rejects when it validates the
# workflow — the whole run is refused, no job in the file starts. (Documented behaviour, unobserved
# here until the first push.) Either way the export belongs in a `run:`, where `$RUNNER_TEMP` is an
# ordinary environment variable; `$GITHUB_ENV` then carries it to every later step, `./check.sh`
# included. `tests/test_ci_workflow.py` stops anyone moving it back, before a push is spent finding
# out.

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant, and these jobs download a
# 64 MB model.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux / ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      # One red version is a fact about that version, and cancelling the others discards it.
      fail-fast: false
      matrix:
        # Tied to `check-matrix.sh`'s `minors=(...)` by `tests/test_ci_workflow.py`.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # **`setup-uv` is pinned to a full patch version, and that is not fussiness.** astral does not
      # maintain a floating major tag: `astral-sh/setup-uv@v10` is a 404, and only full patch tags
      # exist. So a bare major here is not "the latest v10" — it either fails to resolve or, worse,
      # resolves to a **frozen historical tag** — whatever that major pointed at when it was last
      # moved, which can be years and several majors behind, missing every hardening default since.
      # A missing tag fails loudly; this fails silently, running stale code and reporting green.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Point fastembed at a cacheable directory
        # The embedder is 64 MB and fastembed otherwise caches it under `tempfile.gettempdir()`,
        # which on a macOS runner is a per-session `/var/folders/…` path `actions/cache` cannot name
        # at authoring time — it works on Linux only by accident. `$RUNNER_TEMP` rather than the
        # workspace, so 64 MB of untracked model does not land inside the checkout at all. The
        # walkers it would otherwise reach are `test_design_pointers_resolve.py`'s document map,
        # which `rglob`s every `*.md` in the tree and would pick up a model snapshot's own README,
        # and `check-matrix.sh`'s tree identity, which hashes every untracked non-ignored file.
        # *This comment named `test_version_seam.py` and ruff instead, and both were wrong: the
        # seam scan walks `zikaron/` and `tests/` only, and ruff's `include` matches no snapshot
        # file. A reason given for a guard is as checkable as the guard, and this one was not
        # checked.*
        run: echo "FASTEMBED_CACHE_PATH=$RUNNER_TEMP/fastembed_cache" >> "$GITHUB_ENV"

      # **The interpreter comes from `uv`, and this is not a detail.** `enable_load_extension` is a
      # compile-time option, `actions/setup-python`'s builds are unverified in this corpus, and
      # `research/python-portability-probes.md` §4 verified the flag on exactly the
      # python-build-standalone builds `uv` fetches — which are also what a `uv tool install` user
      # gets. So this is what makes the `load_extension` evidence about *the binary users will run*.
      # `--no-bin` for the reason `CLAUDE.md` gives: a `python3.x` in `~/.local/bin` shadows the
      # system one for everything on the machine, not just this project.
      - run: uv python install --no-bin ${{ matrix.python }}

      # **The cache is restored, filled by an explicit fetch, and saved — all before the gate runs.**
      #
      # The obvious shape is a combined `actions/cache` around the whole job, and it is wrong twice
      # over. Its save is a post step gated on job success, so a red job caches nothing — and a job
      # that stays red across a run of failures re-downloads 64 MB every time, exactly when the
      # feedback loop most needs to be short.
      #
      # **And the obvious repair — split it and put `if: always()` on the save — is worse, which is
      # why this comment is long.** `always()` runs the step *even when the run is cancelled*, and
      # `cancel-in-progress: true` above cancels on every new push to the same ref. If the fetch were
      # still inside the gate, a cancel mid-download would leave `huggingface_hub`'s `.incomplete`
      # blobs beside the finished ones, and `always()` would upload that partial directory under a
      # key that **never refreshes**, because a cache writes only on a key miss. Every later run
      # would restore the partial snapshot, re-fetch the missing part, and report nothing. That is
      # the silent-cost class this whole arrangement exists to remove, reintroduced by the fix for it.
      #
      # So the fetch is hoisted out of the gate into its own step, and the save is gated on
      # `cache-hit != 'true'` with **no** `always()`: a cancelled or failed fetch skips the save by
      # default step semantics, a completed one is saved before the gate can go red, and a restore
      # hit skips the save instead of re-uploading 64 MB to be told the key already exists. The
      # red-job argument disappears entirely, because the cache no longer depends on the suite.
      #
      # **Expect two "Unable to reserve cache" warnings on the first run, and after any key change.**
      # The key carries no Python version — correct, the model is interpreter-independent — so all
      # three matrix jobs share it, all three miss on a cold key, all three fetch, and all three try
      # to save. The first wins and the other two log *"another job may be creating this cache"*.
      # That is a warning, never a failure, and it is what a cold cache looks like rather than a
      # defect.
      - name: Restore the embedding model
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/fastembed_cache
          # The model, the revision Zikaron pins it to, and the library that loads it. A cache saves
          # only on a key miss, so a key missing any of the three goes stale permanently rather than
          # refreshing: a cache filled at the previous revision would keep hitting, `snapshots/<new>`
          # would be absent, and every job of every run would download 64 MB while never saving it
          # back. `fastembed` stays in the key because it decides which files are wanted, even though
          # the revision now decides their bytes. `test_ci_workflow.py` reads all three from their
          # sources.
          key: fastembed-0.8.0-bge-small-en-v1.5-52398278842ec682c6f32300af41344b1c0b0bb2-${{ runner.os }}

      - name: Build the virtualenv
        run: |
          uv venv --seed --python ${{ matrix.python }} .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Fetch the embedding model
        # Hoisted out of the gate so the save below can complete before anything can redden or be
        # cancelled. The model id is Zikaron's own default, from `core/config/keys.py`; the drift
        # test ties that default to the cache key so a changed default cannot keep serving the old
        # model out of cache.
        #
        # **Through Zikaron's own loader, not `fastembed` directly**, which is what makes the cache
        # hold the pinned revision the key names. Calling `TextEmbedding` here would fetch whatever
        # the upstream repository's head is, fill a revision-keyed cache with the wrong snapshot,
        # and leave the gate downloading the right one inside itself on every run.
        run: .venv/bin/python -c "from zikaron.core.indexing.encoder import FastEmbedEncoder; FastEmbedEncoder.load('BAAI/bge-small-en-v1.5')"

      - name: Prove the pinned digests against the fetched bytes
        # **The only place a gate checks the digest table against real files** — `zikaron doctor`
        # does it on any machine on demand. Startup verifies what it
        # fetched, and a warm cache is five `stat`s — so a digest edited wrongly at an *unchanged*
        # revision would be green in this job without this step, is green on every warm developer
        # machine, and is met first by a stranger's cold fetch as `bad_config … upgrade zikaron`.
        # A *revision* bump misses the cache
        # and is covered by the fetch above; this covers the other edit. ~200 ms.
        run: .venv/bin/python -c "from zikaron.core.indexing import acquisition as a, model_cache as c, model_pin as p; pin = p.pin_for('BAAI/bge-small-en-v1.5'); v = a.verify(pin, c.snapshot_dir(c.resolved_model_cache_dir(), repo_id=pin.repo_id, revision=pin.revision)); assert v.complete(), v"

      - name: Save the embedding model
        # No `always()`, deliberately — see the block above the restore step.
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/fastembed_cache
          key: fastembed-0.8.0-bge-small-en-v1.5-52398278842ec682c6f32300af41344b1c0b0bb2-${{ runner.os }}

      - name: Record what SQLite this interpreter brought
        # SQLite is bundled with the interpreter and FTS5 ranking can vary by host, which is the one
        # axis no seam can absorb. The service logs this at startup for the same reason; here it puts
        # the version in the run's own record, so a ranking difference between two green runs has
        # somewhere to be read from.
        run: .venv/bin/python -c "import sqlite3, sys; print(sys.version); print('sqlite', sqlite3.sqlite_version)"

      - name: The gate
        # **The deprecation filters are scoped to this step, not to the job or the workflow, and the
        # scope is the point.** `check-matrix.sh` applies them around `./check.sh` alone and builds
        # its virtualenv without them. Setting them wider here would apply them to `pip install`, its
        # PEP 517 backend subprocess and setuptools' editable build — so a `DeprecationWarning` from
        # inside pip on 3.13/3.14 would redden CI's *install* step on a tree the matrix passes,
        # making CI the **stricter** definition of done for a reason that is not this code. That is
        # the mirror of the looser-CI failure this workflow exists to avoid, and equally wrong.
        env:
          PYTEST_ADDOPTS: "-W error::DeprecationWarning -W error::PendingDeprecationWarning"
          PYTHONWARNINGS: "error::DeprecationWarning,error::PendingDeprecationWarning"
        run: ./check.sh

      - name: Report coverage
        # **Uploaded from every job, and merged by Codecov, because coverage here genuinely differs
        # per interpreter**: `service/asyncio_compat.py`'s two version-dependent rows are each
        # unexecuted on the versions that do not select them, so a single job's report would show
        # one of them uncovered and be wrong about the matrix.
        #
        # **It cannot redden the run.** What CI asserts is the matrix's claim — every supported
        # version green on one tree — and a reporting service being unreachable says nothing about
        # that. `check.sh`'s own ratchet is what enforces the floor, on the runner, before this
        # step exists.
        if: always()
        run: .venv/bin/python -m coverage xml
      - uses: codecov/codecov-action@v6
        if: always()
        with:
          files: coverage.xml
          flags: linux-${{ matrix.python }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  macos:
    # **Required.** A red macOS job is a red run, on the same terms as any linux one.
    # `design/distribution.md` §"The macOS job is required" records what the advisory run
    # established, and what a runner with no harness binary still cannot prove.
    name: macos / 3.12
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full patch version for the reason given in the linux job — there is no floating
      # `v10` tag, and a bare major silently resolves to a frozen historical one.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Point fastembed at a cacheable directory
        # See the header — `runner` is step-level only, so this comes from `$RUNNER_TEMP` rather than
        # from a context reference the workflow would be refused for. It matters most here: the
        # macOS default is a per-session `/var/folders/…` path.
        run: echo "FASTEMBED_CACHE_PATH=$RUNNER_TEMP/fastembed_cache" >> "$GITHUB_ENV"

      # **`check.sh` wraps pytest in GNU `timeout`, and macOS has no such binary on `PATH`.** The
      # runner image's own readme lists no `coreutils` among its installed packages, and macOS ships
      # BSD userland with no `timeout(1)` — so nothing provides it. (The readme lists packages rather
      # than `/usr/bin`, so the second half is the documented absence of `timeout` from BSD userland
      # rather than a reading of that file; the proof step below settles it on the runner either
      # way.)
      #
      # **Both halves are required.** Homebrew installs the GNU tools `g`-prefixed, so without the
      # `gnubin` prepend only `gtimeout` is on `PATH` and `check.sh` still dies in the shell before a
      # single test runs — a job reporting a macOS incompatibility while having tested nothing.
      - name: Guarantee GNU timeout
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Prove `timeout` is the GNU one
        # Asserted rather than assumed: the step above is the whole reason this job can run, and a
        # silent `PATH` failure would look exactly like a macOS incompatibility. Under GitHub's
        # `bash -eo pipefail`, a BSD `timeout` — which has no `--version` — fails this step.
        run: |
          command -v timeout
          timeout --version | head -1

      # 3.12 — the floor, and the version a macOS user is likeliest to already have. Not a
      # wheel-availability choice: `onnxruntime` cp314 macOS arm64 wheels have existed since 1.24.1
      # (`research/onnxruntime-macos-wheels.md`), and the earlier reason given here rested on their
      # absence.
      - run: uv python install --no-bin 3.12

      # Restore → fetch → save, all before the gate, for the reason spelled out in the linux job.
      - name: Restore the embedding model
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/fastembed_cache
          key: fastembed-0.8.0-bge-small-en-v1.5-52398278842ec682c6f32300af41344b1c0b0bb2-${{ runner.os }}

      - name: Build the virtualenv
        run: |
          uv venv --seed --python 3.12 .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Fetch the embedding model
        run: .venv/bin/python -c "from zikaron.core.indexing.encoder import FastEmbedEncoder; FastEmbedEncoder.load('BAAI/bge-small-en-v1.5')"

      - name: Prove the pinned digests against the fetched bytes
        # Both jobs, for the reason the linux job's copy gives.
        run: .venv/bin/python -c "from zikaron.core.indexing import acquisition as a, model_cache as c, model_pin as p; pin = p.pin_for('BAAI/bge-small-en-v1.5'); v = a.verify(pin, c.snapshot_dir(c.resolved_model_cache_dir(), repo_id=pin.repo_id, revision=pin.revision)); assert v.complete(), v"

      - name: Save the embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/fastembed_cache
          key: fastembed-0.8.0-bge-small-en-v1.5-52398278842ec682c6f32300af41344b1c0b0bb2-${{ runner.os }}

      - name: Record what SQLite this interpreter brought
        run: .venv/bin/python -c "import sqlite3, sys; print(sys.version); print('sqlite', sqlite3.sqlite_version)"

      - name: The gate
        # Scoped to this step for the reason given in the linux job.
        env:
          PYTEST_ADDOPTS: "-W error::DeprecationWarning -W error::PendingDeprecationWarning"
          PYTHONWARNINGS: "error::DeprecationWarning,error::PendingDeprecationWarning"
        run: ./check.sh

      - name: Report coverage
        # Merged with the linux jobs' — see the reasoning there.
        if: always()
        run: .venv/bin/python -m coverage xml
      - uses: codecov/codecov-action@v6
        if: always()
        with:
          files: coverage.xml
          flags: macos-3.12
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Say what this job does and does not cover
        # The one thing a reader cannot get from a green tick: it is green for the *hermetic* suite.
        # No harness binary exists on a runner, so `integration_kiro` and `integration_claude` are
        # deselected here as everywhere, and nothing on macOS exercises a live session.
        if: always()
        run: |
          echo "## macOS 3.12" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: \`${{ job.status }}\`. This job is **required**." >> "$GITHUB_STEP_SUMMARY"
          echo "It runs the hermetic gate. No harness binary exists here, so no live session is exercised." >> "$GITHUB_STEP_SUMMARY"
